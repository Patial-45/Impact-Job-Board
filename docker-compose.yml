services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: executive
      POSTGRES_PASSWORD: executive
      POSTGRES_DB: executive_match
    ports:
      - '5432:5432'
    volumes:
      - executive_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U executive -d executive_match']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
volumes:
  executive_postgres:
